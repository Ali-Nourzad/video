<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جزئیات سفارش</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">T-Choob Video</a><nav class="nav"><a class="active" href="orders.html">سفارش‌ها</a><a href="new-order.html">ثبت سفارش</a><a href="profile.html">پروفایل</a><button id="logout">خروج</button></nav><button id="theme" class="theme">حالت تاریک</button></div></header><main class="page"><div class="container" id="root"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script>(async()=>{const a=await requireUser();if(!a)return;const id=new URLSearchParams(location.search).get("id");const q=await supabase.from("video_orders").select("*").eq("id",id).eq("customer_id",a.user.id).single();if(q.error){root.innerHTML="<div class=empty>سفارش پیدا نشد.</div>";return}const o=q.data;const[h,f,m]=await Promise.all([supabase.from("order_status_history").select("*").eq("order_id",id).order("created_at"),supabase.from("order_files").select("*").eq("order_id",id).order("created_at"),supabase.from("order_messages").select("*").eq("order_id",id).order("created_at")]);root.innerHTML=`<div class="page-head"><div><span class="eyebrow">${esc(o.order_number)}</span><h1>${esc(o.title)}</h1><p class="muted">${esc(o.subject)}</p></div><span class="status status-${esc(o.status)}">${statusText(o.status)}</span></div><div class="detail-grid"><section class="panel"><h2>اطلاعات سفارش</h2><div class="detail-list"><div><span>مدل</span><strong>${modelText(o.production_model)}</strong></div><div><span>مدت</span><strong>${esc(o.estimated_duration)}</strong></div><div><span>نسبت</span><strong>${esc(o.aspect_ratio)}</strong></div><div><span>کیفیت</span><strong>${esc(o.output_quality)}</strong></div><div><span>سبک</span><strong>${esc(o.video_style)}</strong></div></div><h3>توضیحات</h3><p>${esc(o.description)}</p><h3>توضیحات ویژه</h3><p>${esc(o.special_notes||"-")}</p></section><section class="panel"><h2>تاریخچه وضعیت</h2><div class="timeline">${(h.data||[]).map(x=>`<div class="timeline-item"><strong>${statusText(x.status)}</strong><span>${date(x.created_at)}</span><p>${esc(x.note||"")}</p></div>`).join("")||"<p class=muted>هنوز موردی ثبت نشده است.</p>"}</div></section></div><section class="panel gap"><h2>فایل‌ها</h2><div class="file-list">${(f.data||[]).map(x=>`<a class="file-row" href="${esc(x.file_url)}" target="_blank"><span>${esc(x.file_name)}</span><span>${bytes(x.file_size)}</span></a>`).join("")||"<p class=muted>فایلی وجود ندارد.</p>"}</div></section><section class="panel gap"><h2>گفتگو</h2><div class="messages">${(m.data||[]).map(x=>`<div class="bubble ${x.sender_id===a.user.id?"mine":""}"><p>${esc(x.message)}</p><time>${date(x.created_at)}</time></div>`).join("")||"<p class=muted>هنوز پیامی ثبت نشده است.</p>"}</div><form id="mf" class="form"><textarea id="mi" rows="3" placeholder="پیام خود را بنویسید..." required></textarea><button class="button primary">ارسال پیام</button></form></section>`;mf.onsubmit=async e=>{e.preventDefault();const t=mi.value.trim();if(!t)return;const r=await supabase.from("order_messages").insert({order_id:id,sender_id:a.user.id,message:t});if(!r.error){mi.value="";location.reload()}}})();logout.onclick=logout;</script></body></html>
