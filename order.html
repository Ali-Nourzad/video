<!doctype html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#547c6c">
	<title>جزئیات سفارش | T-Choob Video</title>
	<link rel="preload" href="Lalezar-Regular.ttf" as="font" type="font/ttf" crossorigin>
	<link rel="stylesheet" href="css/style.css">
</head>
<body class="order-detail-page">
	<header class="site-header">
		<div class="container header-inner">
			<a class="brand" href="index.html">T-Choob Video</a>
			<nav class="nav">
				<a class="active" href="orders.html">سفارش‌ها</a>
				<a href="new-order.html">ثبت سفارش</a>
				<a href="profile.html">پروفایل</a>
				<button id="logout" type="button">خروج</button>
			</nav>
			<button id="theme" class="theme" type="button">حالت تاریک</button>
		</div>
	</header>

	<main class="page order-detail-main">
		<div class="container">
			<div id="order-loading" class="order-state-card">
				<span class="loading-spinner"></span>
				<h2>در حال دریافت سفارش...</h2>
			</div>

			<div id="order-error" class="order-state-card hidden">
				<h2>سفارش قابل نمایش نیست</h2>
				<p id="order-error-text" class="muted"></p>
				<a class="button primary" href="orders.html">بازگشت به سفارش‌ها</a>
			</div>

			<div id="order-content" class="customer-order-workspace hidden">
				<aside class="customer-order-sidebar">
					<div class="customer-order-sidebar-head">
						<span class="eyebrow">سفارش</span>
						<strong id="sidebar-order-number">—</strong>
					</div>
					<nav id="order-section-nav" class="customer-order-nav">
						<button class="active" type="button" data-section="overview">اطلاعات سفارش <span>‹</span></button>
						<button type="button" data-section="messages">گفتگو <span>‹</span></button>
						<button type="button" data-section="files">فایل‌ها <span>‹</span></button>
						<button type="button" data-section="timeline">تاریخچه وضعیت <span>‹</span></button>
						<button type="button" data-section="edit">ویرایش سفارش <span>‹</span></button>
					</nav>
					<a class="customer-back-link" href="orders.html">← بازگشت به سفارش‌ها</a>
				</aside>

				<section id="customer-order-view" class="customer-order-view"></section>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="js/config.js"></script>
	<script src="js/supabase.js"></script>
	<script src="js/auth.js"></script>
	<script src="js/app.js"></script>
	<script src="js/order.js"></script>
</body>
</html>
