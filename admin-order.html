<!doctype html>
<html lang="fa" dir="rtl">

<head>

	<meta charset="utf-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1"
	>

	<title>مدیریت سفارش | T-Choob Video</title>

	<link
		rel="stylesheet"
		href="css/style.css"
	>

	<style>

		.admin-order-page {
			padding-bottom: 50px;
		}

		.admin-order-header {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: 20px;
			margin-bottom: 20px;
		}

		.admin-order-header h1 {
			margin: 5px 0 0;
		}

		.admin-order-actions {
			display: flex;
			gap: 8px;
		}

		.admin-detail-grid {
			display: grid;
			grid-template-columns: minmax(0,1.45fr) minmax(280px,.75fr);
			gap: 20px;
			align-items: start;
		}

		.admin-card {
			padding: 22px;
		}

		.admin-card-title {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			margin-bottom: 18px;
		}

		.admin-card-title h2 {
			margin: 0;
			font-size: 18px;
		}

		.admin-card-title small {
			opacity: .6;
		}

		.admin-info-grid {
			display: grid;
			grid-template-columns: repeat(2,1fr);
			gap: 12px;
		}

		.admin-info-item {
			padding: 13px;
			border: 1px solid var(--border,#ddd);
			border-radius: 12px;
			background: rgba(127,127,127,.025);
		}

		.admin-info-item.full {
			grid-column: 1/-1;
		}

		.admin-info-item > span {
			display: block;
			font-size: 12px;
			opacity: .6;
			margin-bottom: 5px;
		}

		.admin-info-item strong {
			display: block;
			line-height: 1.8;
			overflow-wrap: anywhere;
		}

		.admin-description {
			white-space: pre-wrap;
		}

		.admin-customer {
			display: flex;
			flex-direction: column;
			gap: 14px;
		}

		.admin-customer-main {
			display: flex;
			align-items: center;
			gap: 12px;
			padding-bottom: 15px;
			border-bottom: 1px solid var(--border,#ddd);
		}

		.admin-customer-avatar {
			width: 50px;
			height: 50px;
			border-radius: 50%;
			object-fit: cover;
			background: rgba(127,127,127,.1);
		}

		.admin-customer-name {
			font-size: 18px;
			font-weight: 700;
		}

		.admin-customer-line {
			display: flex;
			flex-direction: column;
			gap: 4px;
		}

		.admin-customer-line span {
			font-size: 12px;
			opacity: .6;
		}

		.admin-options {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}

		.admin-option {
			border: 1px solid var(--border,#ddd);
			padding: 7px 10px;
			border-radius: 999px;
			font-size: 13px;
		}

		.admin-status-form {
			display: flex;
			flex-direction: column;
			gap: 11px;
		}

		.admin-cost-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 12px;
		}

		.admin-files {
			display: flex;
			flex-direction: column;
			gap: 9px;
		}

		.admin-file {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 12px;
			border: 1px solid var(--border,#ddd);
			border-radius: 12px;
		}

		.admin-file-name {
			font-weight: 600;
			overflow-wrap: anywhere;
		}

		.admin-history {
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		.admin-history-item {
			position: relative;
			padding: 12px 14px;
			border-right: 3px solid var(--border,#ddd);
			background: rgba(127,127,127,.035);
			border-radius: 8px;
		}

		.admin-history-status {
			font-weight: 700;
		}

		.admin-history-note {
			margin-top: 5px;
			line-height: 1.8;
		}

		.admin-history-date {
			font-size: 11px;
			opacity: .55;
			margin-top: 6px;
		}

		/* Chat */

		.admin-chat-panel {
			padding: 0;
			overflow: hidden;
		}

		.admin-chat-header {
			padding: 18px 20px;
			border-bottom: 1px solid var(--border,#ddd);
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
		}

		.admin-chat-header h2 {
			margin: 0;
			font-size: 18px;
		}

		.admin-chat-online {
			font-size: 12px;
			opacity: .6;
		}

		.admin-chat-messages {
			height: 470px;
			overflow-y: auto;
			padding: 20px;
			display: flex;
			flex-direction: column;
			gap: 13px;
			background: rgba(127,127,127,.025);
		}

		.admin-chat-empty {
			margin: auto;
			text-align: center;
			opacity: .5;
		}

		.chat-message {
			max-width: 72%;
			padding: 10px 13px;
			border-radius: 14px;
			line-height: 1.8;
			white-space: pre-wrap;
			overflow-wrap: anywhere;
		}

		.chat-message.admin {
			align-self: flex-start;
			border-bottom-left-radius: 4px;
			background: rgba(70,120,255,.13);
		}

		.chat-message.customer {
			align-self: flex-end;
			border-bottom-right-radius: 4px;
			background: var(--surface,#fff);
			border: 1px solid var(--border,#ddd);
		}

		.chat-message-meta {
			display: flex;
			align-items: center;
			gap: 7px;
			font-size: 11px;
			opacity: .55;
			margin-bottom: 5px;
		}

		.admin-chat-form {
			padding: 14px;
			border-top: 1px solid var(--border,#ddd);
			display: flex;
			align-items: flex-end;
			gap: 10px;
		}

		.admin-chat-input-wrap {
			flex: 1;
		}

		.admin-chat-form textarea {
			width: 100%;
			min-height: 48px;
			max-height: 130px;
			resize: vertical;
			margin: 0;
		}

		.admin-chat-hint {
			font-size: 11px;
			opacity: .5;
			margin-top: 5px;
		}

		.admin-chat-send {
			height: 48px;
			min-width: 80px;
		}

		/* Create order */

		.admin-create-customer {
			margin-bottom: 18px;
			padding: 14px;
			border-radius: 12px;
			background: rgba(127,127,127,.06);
			border: 1px solid var(--border,#ddd);
		}

		.admin-create-customer strong {
			display: block;
			margin-bottom: 4px;
		}

		.admin-create-form {
			display: flex;
			flex-direction: column;
			gap: 14px;
		}

		.admin-form-grid {
			display: grid;
			grid-template-columns: repeat(2,1fr);
			gap: 13px;
		}

		.admin-form-grid .full {
			grid-column: 1/-1;
		}

		.admin-form-actions {
			display: flex;
			justify-content: flex-start;
			gap: 10px;
			padding-top: 5px;
		}

		.admin-success {
			padding: 11px 13px;
			border-radius: 10px;
			background: rgba(50,160,90,.1);
		}

		@media (max-width: 850px) {

			.admin-detail-grid {
				grid-template-columns: 1fr;
			}

		}

		@media (max-width: 600px) {

			.admin-order-header {
				flex-direction: column;
			}

			.admin-order-actions {
				width: 100%;
			}

			.admin-order-actions .button {
				flex: 1;
			}

			.admin-info-grid,
			.admin-form-grid,
			.admin-cost-grid {
				grid-template-columns: 1fr;
			}

			.admin-info-item.full,
			.admin-form-grid .full {
				grid-column: auto;
			}

			.admin-chat-messages {
				height: 400px;
			}

			.chat-message {
				max-width: 88%;
			}

			.admin-chat-form {
				flex-direction: column;
				align-items: stretch;
			}

			.admin-chat-send {
				width: 100%;
			}

		}

	</style>

</head>


<body>

	<header class="site-header">

		<div class="container header-inner">

			<a
				class="brand"
				href="admin.html"
			>
				T-Choob Video
			</a>


			<nav class="nav">

				<a
					class="active"
					href="admin.html"
				>
					سفارشات
				</a>

				<a href="admin-users.html">
					کاربران
				</a>

				<button
					type="button"
					id="logout"
				>
					خروج
				</button>

			</nav>


			<button
				type="button"
				id="theme"
				class="theme"
			>
				حالت تاریک
			</button>

		</div>

	</header>


	<main class="page">

		<div
			class="container"
			id="root"
		></div>

	</main>


	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

	<script src="js/config.js"></script>
	<script src="js/supabase.js"></script>
	<script src="js/auth.js"></script>
	<script src="js/app.js"></script>
	<script src="js/admin.js"></script>


	<script>

		document.addEventListener("DOMContentLoaded", () => {

			const logout =
				document.getElementById("logout");


			if (logout) {

				logout.addEventListener(
					"click",
					window.logout
				);

			}


			adminOrder();

		});

	</script>

</body>

</html>
