<!doctype html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        مدیریت سفارش | T-Choob Video
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

</head>


<body class="admin-body">


<div
    id="admin-shell"
    class="admin-shell"
>


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        id="admin-sidebar"
        class="admin-sidebar"
    >


        <a
            href="admin.html"
            class="admin-logo"
        >

            <span class="admin-logo-mark">
                TC
            </span>

            <span class="admin-logo-text">

                <strong>
                    T-Choob
                </strong>

                <span>
                    Video Workspace
                </span>

            </span>

        </a>


        <nav class="admin-nav">


            <div class="admin-nav-label">
                مدیریت
            </div>


            <a
                href="admin.html"
                class="admin-nav-item"
            >

                <span class="admin-nav-icon">
                    ◫
                </span>

                <span class="admin-nav-text">
                    سفارشات
                </span>

            </a>


            <a
                href="admin-users.html"
                class="admin-nav-item"
            >

                <span class="admin-nav-icon">
                    ◎
                </span>

                <span class="admin-nav-text">
                    کاربران
                </span>

            </a>


            <div class="admin-nav-label">
                حساب
            </div>


            <button
                id="theme-toggle"
                class="admin-nav-item"
                type="button"
            >

                <span class="admin-nav-icon">
                    ◐
                </span>

                <span class="admin-nav-text">
                    تغییر حالت
                </span>

            </button>


            <button
                id="logout"
                class="admin-nav-item"
                type="button"
            >

                <span class="admin-nav-icon">
                    ↪
                </span>

                <span class="admin-nav-text">
                    خروج
                </span>

            </button>


        </nav>


        <div class="admin-sidebar-bottom">


            <div class="admin-sidebar-user">

                <div class="admin-avatar">
                    A
                </div>

                <div class="admin-user-text">

                    <strong>
                        مدیر سیستم
                    </strong>

                    <span>
                        Administrator
                    </span>

                </div>

            </div>


        </div>


    </aside>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="admin-main">


        <div class="admin-topbar">


            <div class="admin-topbar-title">

                <h1>
                    مدیریت سفارش
                </h1>

                <p>
                    مدیریت کامل پروژه، گفتگو و فایل‌ها
                </p>

            </div>


            <div class="admin-topbar-actions">


                <button
                    id="mobile-sidebar"
                    class="admin-icon-btn"
                    type="button"
                    title="منو"
                >
                    ☰
                </button>


                <button
                    id="sidebar-toggle"
                    class="admin-icon-btn"
                    type="button"
                    title="جمع کردن منو"
                >
                    ⇥
                </button>


                <button
                    id="command-open"
                    class="admin-icon-btn"
                    type="button"
                    title="جستجو"
                >
                    ⌕
                </button>


                <a
                    href="admin.html"
                    class="button secondary"
                >
                    بازگشت
                </a>


            </div>


        </div>


        <div id="root"></div>


    </main>


</div>


<!-- =======================================================
     COMMAND PALETTE
======================================================== -->

<div
    id="command-overlay"
    class="command-overlay"
>


    <div class="command-box">


        <input
            id="command-search"
            class="command-search"
            type="text"
            placeholder="جستجو در سفارش..."
            autocomplete="off"
        >


        <div
            id="command-results"
            class="command-results"
        ></div>


    </div>


</div>


<div
    id="toast-container"
    class="toast-container"
></div>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/config.js"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

<script src="js/app.js"></script>

<script src="js/admin.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        if (typeof adminOrder === "function") {
            adminOrder();
        }

    }
);

</script>


</body>
</html>
