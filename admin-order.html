<!doctype html>
<html lang="fa" dir="rtl">

<head>

	<meta charset="utf-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1"
	>

	<title>جزئیات سفارش | T-Choob Video</title>

	<link
		rel="stylesheet"
		href="css/style.css"
	>

	<style>

		.admin-order-page {
			display: flex;
			flex-direction: column;
			gap: 20px;
		}

		.admin-detail-grid {
			display: grid;
			grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.8fr);
			gap: 20px;
			align-items: start;
		}

		.admin-order-info {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 14px;
		}

		.admin-info-item {
			border: 1px solid var(--border, #ddd);
			border-radius: 10px;
			padding: 13px;
		}

		.admin-info-item.full {
			grid-column: 1 / -1;
		}

		.admin-info-item span {
			display: block;
			font-size: 13px;
			opacity: 0.65;
			margin-bottom: 6px;
		}

		.admin-info-item strong {
			display: block;
			line-height: 1.8;
			overflow-wrap: anywhere;
		}

		.admin-description {
			white-space: pre-wrap;
			line-height: 2;
		}

		.admin-options {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}

		.admin-option {
			border: 1px solid var(--border, #ddd);
			border-radius: 999px;
			padding: 6px 10px;
			font-size: 13px;
		}

		.admin-customer-card {
			display: flex;
			flex-direction: column;
			gap: 14px;
		}

		.admin-customer-name {
			font-size: 20px;
			font-weight: 700;
		}

		.admin-customer-item {
			display: flex;
			flex-direction: column;
			gap: 4px;
		}

		.admin-customer-item span {
			font-size: 13px;
			opacity: 0.65;
		}

		.admin-status-form {
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		.admin-files {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.admin-file {
			border: 1px solid var(--border, #ddd);
			border-radius: 10px;
			padding: 12px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 15px;
		}

		.admin-file-name {
			font-weight: 600;
			overflow-wrap: anywhere;
		}

		.admin-chat {
			display: flex;
			flex-direction: column;
			min-height: 400px;
		}

		.admin-chat-messages {
			flex: 1;
			min-height: 280px;
			max-height: 550px;
			overflow-y: auto;
			padding: 15px;
			border: 1px solid var(--border, #ddd);
			border-radius: 12px;
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.chat-message {
			max-width: 78%;
			padding: 10px 13px;
			border-radius: 12px;
			line-height: 1.8;
			white-space: pre-wrap;
			overflow-wrap: anywhere;
		}

		.chat-message.admin {
			align-self: flex-start;
			background: rgba(60, 120, 255, 0.12);
		}

		.chat-message.customer {
			align-self: flex-end;
			background: rgba(127, 127, 127, 0.12);
		}

		.chat-message-meta {
			display: block;
			font-size: 11px;
			opacity: 0.6;
			margin-bottom: 4px;
		}

		.admin-chat-form {
			display: flex;
			gap: 10px;
			margin-top: 12px;
		}

		.admin-chat-form textarea {
			flex: 1;
			resize: vertical;
			min-height: 48px;
		}

		.admin-history {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.history-item {
			border-right: 3px solid var(--border, #ddd);
			padding: 8px 12px;
		}

		.history-status {
			font-weight: 700;
			margin-bottom: 3px;
		}

		.history-meta {
			font-size: 12px;
			opacity: 0.65;
		}

		.empty-box {
			text-align: center;
			padding: 25px;
			opacity: 0.65;
		}

		@media (max-width: 850px) {

			.admin-detail-grid {
				grid-template-columns: 1fr;
			}

		}

		@media (max-width: 600px) {

			.admin-order-info {
				grid-template-columns: 1fr;
			}

			.admin-info-item.full {
				grid-column: auto;
			}

			.admin-chat-form {
				flex-direction: column;
			}

			.chat-message {
				max-width: 90%;
			}

		}

	</style>

</head>


<body>

	<header class="site-header">

		<div class="container header-inner">

			<a
				class="brand"
				href="admin.html"
			>
				T-Choob Video
			</a>


			<nav class="nav">

				<a
					class="active"
					href="admin.html"
				>
					سفارشات
				</a>

				<a href="admin-users.html">
					کاربران
				</a>

				<button
					type="button"
					id="logout"
				>
					خروج
				</button>

			</nav>


			<button
				type="button"
				id="theme"
				class="theme"
			>
				حالت تاریک
			</button>

		</div>

	</header>


	<main class="page">

		<div
			class="container"
			id="root"
		></div>

	</main>


	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

	<script src="js/config.js"></script>
	<script src="js/supabase.js"></script>
	<script src="js/auth.js"></script>
	<script src="js/app.js"></script>
	<script src="js/admin.js"></script>


	<script>

		document.addEventListener("DOMContentLoaded", () => {

			const logoutButton =
				document.getElementById("logout");


			if (logoutButton) {

				logoutButton.addEventListener(
					"click",
					logout
				);

			}


			adminOrder();

		});

	</script>

</body>

</html>
