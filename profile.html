<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پروفایل</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">T-Choob Video</a><nav class="nav"><a href="orders.html">سفارش‌ها</a><a href="new-order.html">ثبت سفارش</a><a class="active" href="profile.html">پروفایل</a><button id="logout">خروج</button></nav><button id="theme" class="theme">حالت تاریک</button></div></header><main class="page"><div class="container narrow"><div class="page-head"><h1>پروفایل</h1></div><section class="panel"><form id="form" class="form"><div class="grid"><label>نام<input id="first"></label><label>نام خانوادگی<input id="last"></label></div><label>ایمیل<input id="email" disabled></label><label>شماره تماس<input id="phone"></label><label>آدرس<textarea id="address" rows="4"></textarea></label><div id="msg" class="message"></div><button class="button primary">ذخیره تغییرات</button></form></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script>(async()=>{const a=await requireUser();if(!a)return;first.value=a.profile.first_name||"";last.value=a.profile.last_name||"";email.value=a.user.email||"";phone.value=a.profile.phone||"";address.value=a.profile.address||""})();form.onsubmit=async e=>{e.preventDefault();const r=await saveProfile({firstName:first.value.trim(),lastName:last.value.trim(),phone:phone.value.trim(),address:address.value.trim()});msg.textContent=r.ok?"تغییرات ذخیره شد.":r.error;msg.className="message "+(r.ok?"success":"error")};logout.onclick=logout;</script></body></html>
