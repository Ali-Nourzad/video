<!doctype html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#31526b">
	<title>مدیریت سفارشات | T-Choob Video</title>
	<link rel="stylesheet" href="css/style.css">
</head>

<body class="admin-page">
	<header class="site-header">
		<div class="container header-inner">
			<a class="brand" href="admin.html" aria-label="T-Choob Video">
				<span class="brand-mark">TC</span>
				<span>T-Choob Video</span>
			</a>

			<nav class="nav admin-nav" aria-label="ناوبری مدیریت">
				<a class="active" href="admin.html">سفارشات</a>
				<a href="admin-users.html">کاربران</a>
				<button id="logout" class="nav-button danger-text" type="button">خروج</button>
			</nav>

			<button id="theme" class="theme" type="button">حالت تاریک</button>
		</div>
	</header>

	<main class="page">
		<div class="container">
			<div class="page-head">
				<div>
					<span class="eyebrow">پنل مدیریت</span>
					<h1>مدیریت سفارشات</h1>
					<p class="page-subtitle">مدیریت، بررسی و پیگیری سفارش‌های ثبت‌شده</p>
				</div>

				<button id="refresh" class="button secondary" type="button">
					<span aria-hidden="true">↻</span>
					بروزرسانی
				</button>
			</div>

			<section class="stats admin-stats" aria-label="آمار سفارشات">
				<div class="stat">
					<span>کل سفارش‌ها</span>
					<strong id="total">0</strong>
				</div>
				<div class="stat">
					<span>جدید</span>
					<strong id="new">0</strong>
				</div>
				<div class="stat">
					<span>در حال انجام</span>
					<strong id="progress">0</strong>
				</div>
				<div class="stat">
					<span>آماده تحویل</span>
					<strong id="ready">0</strong>
				</div>
				<div class="stat stat-success">
					<span>تکمیل شده</span>
					<strong id="completed">0</strong>
				</div>
				<div class="stat stat-danger">
					<span>لغو شده</span>
					<strong id="cancelled">0</strong>
				</div>
			</section>

			<section class="admin-toolbar panel">
				<div class="filter-tabs" role="tablist" aria-label="فیلتر سفارش‌ها">
					<button class="filter-tab active" type="button" onclick="filterAdminOrders('all')">
						همه
						<span id="filter-all-count">0</span>
					</button>
					<button class="filter-tab" type="button" onclick="filterAdminOrders('active')">
						در حال انجام
						<span id="filter-active-count">0</span>
					</button>
					<button class="filter-tab" type="button" onclick="filterAdminOrders('completed')">
						تکمیل شده
						<span id="filter-completed-count">0</span>
					</button>
					<button class="filter-tab" type="button" onclick="filterAdminOrders('cancelled')">
						لغو شده
						<span id="filter-cancelled-count">0</span>
					</button>
				</div>

				<label class="search-box">
					<span class="search-icon" aria-hidden="true">⌕</span>
					<input
						id="orders-search"
						type="search"
						placeholder="جست‌وجو بر اساس شماره، عنوان، کاربر، ایمیل..."
						autocomplete="off"
						oninput="searchAdminOrders(this.value)"
					>
				</label>
			</section>

			<section class="panel orders-panel">
				<div class="panel-header">
					<div>
						<h2 id="orders-caption">همه سفارش‌ها</h2>
						<p>فهرست سفارش‌ها و وضعیت فعلی آن‌ها</p>
					</div>
					<span id="visible-orders-count" class="result-count">0 سفارش</span>
				</div>

				<div class="table-wrap">
					<table class="table admin-table">
						<thead>
							<tr>
								<th>شماره</th>
								<th>عنوان</th>
								<th>کاربر</th>
								<th>مدل</th>
								<th>وضعیت</th>
								<th>تاریخ</th>
								<th>عملیات</th>
							</tr>
						</thead>
						<tbody id="orders-body">
							<tr>
								<td colspan="7" class="table-loading">
									<span class="loading-spinner"></span>
									در حال دریافت سفارش‌ها...
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</section>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="js/config.js"></script>
	<script src="js/supabase.js"></script>
	<script src="js/auth.js"></script>
	<script src="js/app.js"></script>
	<script src="js/admin.js"></script>

	<script>
		document.addEventListener("DOMContentLoaded", () => {
			document.getElementById("logout")?.addEventListener("click", logout);
			document.getElementById("refresh")?.addEventListener("click", adminOrders);
			adminOrders();
		});
	</script>
</body>
</html>
