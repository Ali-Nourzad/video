<!doctype html>
<html lang="fa" dir="rtl">

<head>

	<meta charset="utf-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1"
	>

	<title>ثبت سفارش | T-Choob Video</title>

	<link
		rel="stylesheet"
		href="css/style.css"
	>

</head>


<body>

	<header class="site-header">

		<div class="container header-inner">

			<a
				class="brand"
				href="index.html"
			>
				T-Choob Video
			</a>


			<nav class="nav">

				<a href="orders.html">
					سفارش‌ها
				</a>

				<a
					class="active"
					href="new-order.html"
				>
					ثبت سفارش
				</a>

				<a href="profile.html">
					پروفایل
				</a>

				<button
					id="logout"
					type="button"
				>
					خروج
				</button>

			</nav>


			<button
				id="theme"
				class="theme"
				type="button"
			>
				حالت تاریک
			</button>

		</div>

	</header>



	<main class="page">

		<div class="container narrow">

			<div class="page-head">

				<div>

					<span class="eyebrow">
						T-Choob Video
					</span>

					<h1>
						ثبت سفارش ویدیو
					</h1>

					<p class="muted">
						اطلاعات پروژه خود را وارد کنید.
					</p>

				</div>

			</div>



			<form
				id="form"
				class="panel form"
			>


				<label>

					نام فیلم

					<input
						id="title"
						type="text"
						required
						maxlength="180"
						placeholder="نام پروژه"
					>

				</label>



				<label>

					موضوع

					<input
						id="subject"
						type="text"
						required
						maxlength="250"
						placeholder="موضوع ویدیو"
					>

				</label>



				<label>

					توضیحات

					<textarea
						id="description"
						rows="6"
						required
						placeholder="توضیحات کامل پروژه"
					></textarea>

				</label>



				<div class="grid">


					<label>

						زمان تقریبی

						<select id="duration">

							<option value="30">
								حدود ۳۰ ثانیه
							</option>

							<option value="60">
								حدود ۱ دقیقه
							</option>

							<option value="120">
								حدود ۲ دقیقه
							</option>

							<option value="180">
								حدود ۳ دقیقه
							</option>

							<option value="300">
								حدود ۵ دقیقه
							</option>

							<option value="600">
								حدود ۱۰ دقیقه
							</option>

							<option value="custom">
								بیشتر از ۱۰ دقیقه
							</option>

						</select>

					</label>



					<label>

						نسبت تصویر

						<select id="ratio">

							<option value="16:9">
								16:9
							</option>

							<option value="9:16">
								9:16
							</option>

							<option value="1:1">
								1:1
							</option>

							<option value="4:5">
								4:5
							</option>

						</select>

					</label>


				</div>



				<div class="grid">


					<label>

						کیفیت

						<select id="quality">

							<option value="1080p">
								1080p
							</option>

							<option value="720p">
								720p
							</option>

							<option value="4K">
								4K
							</option>

						</select>

					</label>



					<label>

						سبک

						<select id="style">

							<option value="آزاد">
								آزاد
							</option>

							<option value="تبلیغاتی">
								تبلیغاتی
							</option>

							<option value="آموزشی">
								آموزشی
							</option>

							<option value="مستند">
								مستند
							</option>

							<option value="شبکه اجتماعی">
								شبکه اجتماعی
							</option>

							<option value="سینمایی">
								سینمایی
							</option>

						</select>

					</label>


				</div>



				<h2>
					مدل سفارش
				</h2>



				<div class="choice-grid">


					<label class="choice">

						<input
							type="radio"
							name="model"
							value="edit_only"
							checked
						>

						<strong>
							صوت و تصویر آماده است
						</strong>

						<small>
							فقط تدوین
						</small>

					</label>



					<label class="choice">

						<input
							type="radio"
							name="model"
							value="voice_ready"
						>

						<strong>
							صوت آماده است
						</strong>

						<small>
							تصویر و تدوین
						</small>

					</label>



					<label class="choice">

						<input
							type="radio"
							name="model"
							value="visual_ready"
						>

						<strong>
							تصویر آماده است
						</strong>

						<small>
							صوت و تدوین
						</small>

					</label>



					<label class="choice">

						<input
							type="radio"
							name="model"
							value="script_ready"
						>

						<strong>
							سناریو آماده است
						</strong>

						<small>
							صوت، تصویر و تدوین
						</small>

					</label>



					<label class="choice">

						<input
							type="radio"
							name="model"
							value="full_production"
						>

						<strong>
							هیچ‌چیز آماده نیست
						</strong>

						<small>
							سناریو، صوت، تصویر و تدوین
						</small>

					</label>


				</div>



				<div
					id="work"
					class="tags"
				></div>



				<label>

					فایل‌ها

					<input
						id="files"
						type="file"
						multiple
					>

					<small class="help">
						سناریو، صوت، تصویر یا ویدیوی خام را انتخاب کنید.
					</small>

				</label>



				<label>

					لینک‌های مرجع

					<textarea
						id="links"
						rows="4"
						placeholder="لینک نمونه یا مرجع"
					></textarea>

				</label>



				<label>

					توضیحات ویژه

					<textarea
						id="notes"
						rows="4"
						placeholder="نکات مهم پروژه"
					></textarea>

				</label>



				<div
					id="msg"
					class="message"
				></div>



				<button
					id="submit"
					class="button primary full"
					type="submit"
				>
					ثبت سفارش
				</button>


			</form>

		</div>

	</main>



	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

	<script src="js/config.js"></script>

	<script src="js/supabase.js"></script>

	<script src="js/auth.js"></script>

	<script src="js/app.js"></script>

	<script src="js/orders.js"></script>



	<script>

		let currentUser = null;


		async function initPage() {

			const auth =
				await requireUser();


			if (!auth) {
				return;
			}


			currentUser =
				auth.user;

		}


		initPage();



		function renderModel() {

			const model =
				document.querySelector(
					'input[name="model"]:checked'
				).value;


			const workMap = {

				edit_only: [
					"تدوین"
				],

				voice_ready: [
					"تصویر",
					"تدوین"
				],

				visual_ready: [
					"صوت",
					"تدوین"
				],

				script_ready: [
					"صوت",
					"تصویر",
					"تدوین"
				],

				full_production: [
					"سناریو",
					"صوت",
					"تصویر",
					"تدوین"
				]

			};


			const items =
				workMap[model] || [];


			document.getElementById("work").innerHTML =
				items
					.map(
						item =>
							`<span>${item}</span>`
					)
					.join("");

		}



		document
			.querySelectorAll(
				'input[name="model"]'
			)
			.forEach(
				input => {

					input.addEventListener(
						"change",
						renderModel
					);

				}
			);


		renderModel();



		document
			.getElementById("logout")
			.addEventListener(
				"click",
				logout
			);



		document
			.getElementById("form")
			.addEventListener(
				"submit",
				async event => {

					event.preventDefault();


					const submit =
						document.getElementById(
							"submit"
						);

					const msg =
						document.getElementById(
							"msg"
						);


					submit.disabled = true;

					msg.className =
						"message";

					msg.textContent =
						"در حال ثبت سفارش...";


					const result =
						await createOrder({

							userId:
								currentUser?.id,

							title:
								document
									.getElementById("title")
									.value
									.trim(),

							subject:
								document
									.getElementById("subject")
									.value
									.trim(),

							description:
								document
									.getElementById("description")
									.value
									.trim(),

							duration:
								document
									.getElementById("duration")
									.value,

							model:
								document
									.querySelector(
										'input[name="model"]:checked'
									)
									.value,

							aspectRatio:
								document
									.getElementById("ratio")
									.value,

							quality:
								document
									.getElementById("quality")
									.value,

							style:
								document
									.getElementById("style")
									.value,

							links:
								document
									.getElementById("links")
									.value
									.trim(),

							notes:
								document
									.getElementById("notes")
									.value
									.trim(),

							files:
								document
									.getElementById("files")
									.files

						});


					if (!result.ok) {

						msg.className =
							"message error";

						msg.textContent =
							result.error;

						submit.disabled = false;

						return;

					}


					msg.className =
						"message success";

					msg.textContent =
						"سفارش با موفقیت ثبت شد.";


					window.location.href =
						`order.html?id=${encodeURIComponent(result.order.id)}`;

				}
			);

	</script>

</body>

</html>
