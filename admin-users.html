<!doctype html>
<html lang="fa" dir="rtl">

<head>

	<meta charset="utf-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1"
	>

	<title>مدیریت کاربران | T-Choob Video</title>

	<link
		rel="stylesheet"
		href="css/style.css"
	>

	<style>

		.admin-users-page {
			padding-bottom: 50px;
		}

		.admin-users-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 15px;
			margin-bottom: 22px;
		}

		.admin-users-head h1 {
			margin: 5px 0 0;
		}

		.admin-users-actions {
			display: flex;
			gap: 9px;
		}

		.admin-users-panel {
			padding: 0;
			overflow: hidden;
		}

		.admin-user-row:hover {
			background: rgba(127,127,127,.05);
		}

		.admin-user-name {
			display: flex;
			align-items: center;
			gap: 10px;
			min-width: 150px;
		}

		.admin-user-avatar {
			width: 36px;
			height: 36px;
			border-radius: 50%;
			object-fit: cover;
			background: rgba(127,127,127,.1);
		}

		.admin-role {
			display: inline-flex;
			padding: 5px 9px;
			border-radius: 999px;
			font-size: 12px;
			background: rgba(127,127,127,.1);
		}

		@media (max-width: 600px) {

			.admin-users-head {
				align-items: flex-start;
				flex-direction: column;
			}

			.admin-users-actions {
				width: 100%;
			}

			.admin-users-actions .button {
				flex: 1;
			}

		}

	</style>

</head>


<body>

	<header class="site-header">

		<div class="container header-inner">

			<a
				class="brand"
				href="admin.html"
			>
				T-Choob Video
			</a>


			<nav class="nav">

				<a href="admin.html">
					سفارشات
				</a>

				<a
					class="active"
					href="admin-users.html"
				>
					کاربران
				</a>

				<button
					type="button"
					id="logout"
				>
					خروج
				</button>

			</nav>


			<button
				type="button"
				id="theme"
				class="theme"
			>
				حالت تاریک
			</button>

		</div>

	</header>


	<main class="page admin-users-page">

		<div class="container">


			<div class="admin-users-head">

				<div>

					<span class="eyebrow">
						پنل مدیریت
					</span>

					<h1>
						کاربران
					</h1>

				</div>


				<div class="admin-users-actions">

					<a
						class="button secondary"
						href="admin.html"
					>
						مشاهده سفارشات
					</a>

					<button
						type="button"
						id="refresh"
						class="button primary"
					>
						بروزرسانی
					</button>

				</div>

			</div>


			<section class="panel admin-users-panel">

				<div class="table-wrap">

					<table class="table">

						<thead>

							<tr>

								<th>
									کاربر
								</th>

								<th>
									ایمیل
								</th>

								<th>
									تلفن
								</th>

								<th>
									نقش
								</th>

								<th>
									عضویت
								</th>

								<th>
									عملیات
								</th>

							</tr>

						</thead>


						<tbody id="users-body"></tbody>

					</table>

				</div>

			</section>


		</div>

	</main>


	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

	<script src="js/config.js"></script>
	<script src="js/supabase.js"></script>
	<script src="js/auth.js"></script>
	<script src="js/app.js"></script>
	<script src="js/admin.js"></script>


	<script>

		document.addEventListener("DOMContentLoaded", () => {

			const logout =
				document.getElementById("logout");

			const refresh =
				document.getElementById("refresh");


			if (logout) {

				logout.addEventListener(
					"click",
					window.logout
				);

			}


			if (refresh) {

				refresh.addEventListener(
					"click",
					adminUsers
				);

			}


			adminUsers();

		});

	</script>

</body>

</html>
