<!doctype html>
<html lang="fa" dir="rtl">

<head>

	<meta charset="utf-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1"
	>

	<title>مدیریت کاربران | T-Choob Video</title>

	<link
		rel="stylesheet"
		href="css/style.css"
	>

	<link
		rel="stylesheet"
		href="css/admin.css"
	>

</head>


<body class="admin-page">

	<header class="site-header admin-header">

		<div class="container header-inner">

			<a
				class="brand"
				href="admin.html"
			>
				T-Choob Video
			</a>


			<nav class="nav">

				<a href="admin.html">
					سفارشات
				</a>

				<a
					class="active"
					href="admin-users.html"
				>
					کاربران
				</a>

				<button
					type="button"
					id="logout"
				>
					خروج
				</button>

			</nav>


			<button
				type="button"
				id="theme"
				class="theme"
			>
				حالت تاریک
			</button>

		</div>

	</header>


	<main class="page admin-main">

		<div class="container">

			<div class="admin-topbar">

				<div>

					<span class="eyebrow">
						پنل مدیریت
					</span>

					<h1>
						مدیریت کاربران
					</h1>

					<p class="admin-subtitle">
						کاربران ثبت‌نام‌شده را مشاهده کنید و برای هر کاربر سفارش ایجاد کنید.
					</p>

				</div>


				<div class="admin-actions">

					<a
						class="button primary"
						href="admin.html"
					>
						مشاهده سفارش‌ها
					</a>

					<button
						type="button"
						id="refresh"
						class="button secondary"
					>
						بروزرسانی
					</button>

				</div>

			</div>


			<section class="admin-user-summary">

				<div class="admin-stat">

					<div class="admin-stat-label">
						تعداد کاربران
					</div>

					<strong id="users-total">
						0
					</strong>

				</div>


				<div class="admin-stat">

					<div class="admin-stat-label">
						مشتریان
					</div>

					<strong id="customers-total">
						0
					</strong>

				</div>


				<div class="admin-stat">

					<div class="admin-stat-label">
						ادمین‌ها
					</div>

					<strong id="admins-total">
						0
					</strong>

				</div>

			</section>


			<section class="panel">

				<div class="panel-heading">

					<div>

						<h2>
							کاربران
						</h2>

						<p>
							برای ایجاد سفارش، کاربر موردنظر را انتخاب کنید.
						</p>

					</div>

				</div>


				<div class="table-wrap admin-table-wrap">

					<table class="table admin-table">

						<thead>

							<tr>

								<th>
									نام
								</th>

								<th>
									ایمیل
								</th>

								<th>
									تلفن
								</th>

								<th>
									نقش
								</th>

								<th>
									عضویت
								</th>

								<th>
									عملیات
								</th>

							</tr>

						</thead>


						<tbody id="users-body">

							<tr>

								<td
									colspan="6"
									class="table-loading"
								>
									در حال دریافت کاربران...
								</td>

							</tr>

						</tbody>

					</table>

				</div>

			</section>

		</div>

	</main>


	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

	<script src="js/config.js"></script>

	<script src="js/supabase.js"></script>

	<script src="js/auth.js"></script>

	<script src="js/app.js"></script>

	<script src="js/admin.js"></script>


	<script>

		document.addEventListener("DOMContentLoaded", () => {

			const logoutButton = document.getElementById("logout");

			const refreshButton = document.getElementById("refresh");


			if (logoutButton) {

				logoutButton.addEventListener(
					"click",
					logout
				);

			}


			if (refreshButton) {

				refreshButton.addEventListener(
					"click",
					() => adminUsers()
				);

			}


			adminUsers();

		});

	</script>

</body>

</html>
