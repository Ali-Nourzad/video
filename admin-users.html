<!doctype html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#547c6c">
	<title>مدیریت کاربران | T-Choob Video</title>
	<link rel="preload" href="Lalezar-Regular.ttf" as="font" type="font/ttf" crossorigin>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin-page">
	<header class="site-header">
		<div class="container header-inner">
			<a class="brand" href="admin.html" aria-label="T-Choob Video">
				<span>T-Choob Video</span>
			</a>

			<nav class="nav admin-nav" aria-label="ناوبری مدیریت">
				<a class="" href="admin.html">سفارشات</a>
				<a class="active" href="admin-users.html">کاربران</a>
				<button id="logout" type="button">خروج</button>
			</nav>

			<button id="theme" class="theme" type="button"
				onclick="toggleTchoobTheme(event)">حالت تاریک</button>
		</div>
	</header>

	
<main class="page admin-main">
	<div class="container">
		<section class="admin-topbar">
			<div>
				<span class="eyebrow">پنل مدیریت</span>
				<h1>مدیریت کاربران</h1>
				<p class="admin-subtitle">کاربران ثبت‌نام‌شده، نقش‌ها و اطلاعات تماس را مدیریت کنید.</p>
			</div>
			<div class="admin-actions">
				<a class="button primary" href="admin.html">مشاهده سفارش‌ها</a>
				<button id="refresh" class="button secondary" type="button">↻ بروزرسانی</button>
			</div>
		</section>

		<section class="users-toolbar">
			<div class="users-search">
				<label for="users-search">جستجوی کاربر</label>
				<input id="users-search" type="search" placeholder="نام، ایمیل، تلفن..." autocomplete="off">
			</div>
			<div class="status status-new"><span id="users-count">0 کاربر</span></div>
		</section>

		<section class="admin-content">
			<div class="panel-heading">
				<div><h2>فهرست کاربران</h2><p>اطلاعات از جدول profiles خوانده می‌شود.</p></div>
			</div>
			<div class="table-wrap admin-table-wrap">
				<table class="table admin-table users-table">
					<thead><tr><th>کاربر</th><th>ایمیل</th><th>تلفن</th><th>نقش</th><th>عضویت</th><th>عملیات</th></tr></thead>
					<tbody id="users-body"><tr><td colspan="6" class="table-loading">در حال دریافت کاربران...</td></tr></tbody>
				</table>
			</div>
		</section>
	</div>
</main>


	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="js/config.js"></script>
	<script src="js/supabase.js"></script>
	<script src="js/auth.js"></script>
	<script src="js/app.js"></script>
	<script src="js/admin.js"></script>
	<script>
		document.addEventListener("DOMContentLoaded", () => {
			document.getElementById("logout")?.addEventListener("click", logout);
			applyTchoobTheme();
		});
	</script>
</body>
</html>
