<!doctype html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#31526b">
	<title>مدیریت کاربران | T-Choob Video</title>
	<link rel="stylesheet" href="css/style.css">
</head>

<body class="admin-page">
	<header class="site-header">
		<div class="container header-inner">
			<a class="brand" href="admin.html" aria-label="T-Choob Video">
				<span class="brand-mark">TC</span>
				<span>T-Choob Video</span>
			</a>

			<nav class="nav admin-nav" aria-label="ناوبری مدیریت">
				<a href="admin.html">سفارشات</a>
				<a class="active" href="admin-users.html">کاربران</a>
				<button id="logout" class="nav-button danger-text" type="button">خروج</button>
			</nav>

			<button id="theme" class="theme" type="button">حالت تاریک</button>
		</div>
	</header>

	<main class="page">
		<div class="container">
			<div class="page-head">
				<div>
					<span class="eyebrow">پنل مدیریت</span>
					<h1>کاربران</h1>
					<p class="page-subtitle">فهرست کاربران ثبت‌نام‌شده در T-Choob Video</p>
				</div>

				<button id="refresh" class="button secondary" type="button">
					<span aria-hidden="true">↻</span>
					بروزرسانی
				</button>
			</div>

			<section class="panel users-panel">
				<div class="panel-header">
					<div>
						<h2>فهرست کاربران</h2>
						<p>اطلاعات حساب‌ها از جدول profiles دریافت می‌شود.</p>
					</div>
				</div>

				<div class="table-wrap">
					<table class="table admin-table users-table">
						<thead>
							<tr>
								<th>کاربر</th>
								<th>ایمیل</th>
								<th>تلفن</th>
								<th>نقش</th>
								<th>عضویت</th>
								<th>عملیات</th>
							</tr>
						</thead>
						<tbody id="users-body">
							<tr>
								<td colspan="6" class="table-loading">
									<span class="loading-spinner"></span>
									در حال دریافت کاربران...
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</section>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="js/config.js"></script>
	<script src="js/supabase.js"></script>
	<script src="js/auth.js"></script>
	<script src="js/app.js"></script>
	<script src="js/admin.js"></script>

	<script>
		document.addEventListener("DOMContentLoaded", () => {
			document.getElementById("logout")?.addEventListener("click", logout);
			document.getElementById("refresh")?.addEventListener("click", adminUsers);
			adminUsers();
		});
	</script>
</body>
</html>
