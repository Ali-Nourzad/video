<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود</title><link rel="stylesheet" href="css/style.css"></head><body class="auth"><section class="auth-card"><a class="brand" href="index.html">T-Choob Video</a><h1>ورود به حساب</h1><p class="muted">برای مدیریت سفارش‌ها وارد شوید.</p><form id="form" class="form"><label>ایمیل<input id="email" type="email" required></label><label>رمز عبور<input id="password" type="password" required></label><div id="msg" class="message"></div><button class="button primary full">ورود</button></form><p class="auth-link">حساب ندارید؟ <a href="signup.html">ثبت‌نام</a></p></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script>form.onsubmit=async e=>{e.preventDefault();msg.textContent="در حال ورود...";const r=await login(email.value.trim(),password.value);if(!r.ok){msg.textContent=r.error;msg.className="message error";return}location.href=r.profile?.role==="admin"?"admin.html":"orders.html"}</script></body></html>
