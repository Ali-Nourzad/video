<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت‌نام</title><link rel="stylesheet" href="css/style.css"></head><body class="auth"><section class="auth-card"><a class="brand" href="index.html">T-Choob Video</a><h1>ساخت حساب</h1><form id="form" class="form"><div class="grid"><label>نام<input id="first" required></label><label>نام خانوادگی<input id="last" required></label></div><label>ایمیل<input id="email" type="email" required></label><label>شماره تماس<input id="phone" type="tel"></label><label>رمز عبور<input id="password" type="password" minlength="6" required></label><div id="msg" class="message"></div><button class="button primary full">ثبت‌نام</button></form><p class="auth-link">حساب دارید؟ <a href="login.html">ورود</a></p></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script>form.onsubmit=async e=>{e.preventDefault();const r=await signup({firstName:first.value.trim(),lastName:last.value.trim(),email:email.value.trim(),phone:phone.value.trim(),password:password.value});msg.textContent=r.ok?r.message:r.error;msg.className="message "+(r.ok?"success":"error");if(r.ok&&r.session)setTimeout(()=>location.href="orders.html",600)}</script></body></html>
