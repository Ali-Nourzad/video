<!doctype html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>ثبت‌نام | T-Choob Video</title>
	<link rel="stylesheet" href="css/style.css">
</head>

<body class="auth">
	<section class="auth-card">
		<a class="brand" href="index.html">T-Choob Video</a>

		<h1>ساخت حساب</h1>
		<p class="auth-subtitle">اطلاعات خود را وارد کنید تا حساب شما ساخته شود.</p>

		<form id="form" class="form">
			<div class="grid">
				<label>
					نام
					<input id="first" autocomplete="given-name" required>
				</label>

				<label>
					نام خانوادگی
					<input id="last" autocomplete="family-name" required>
				</label>
			</div>

			<label>
				ایمیل
				<input id="email" type="email" autocomplete="email" required>
			</label>

			<label>
				شماره تماس
				<input id="phone" type="tel" autocomplete="tel">
			</label>

			<label>
				آدرس
				<textarea id="address" rows="3" autocomplete="street-address"></textarea>
			</label>

			<label>
				رمز عبور
				<input id="password" type="password" autocomplete="new-password" minlength="6" required>
			</label>

			<div id="msg" class="message"></div>

			<button type="submit" class="button primary full">
				ثبت‌نام
			</button>
		</form>

		<p class="auth-link">
			حساب دارید؟
			<a href="login.html">ورود</a>
		</p>
	</section>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="js/config.js"></script>
	<script src="js/supabase.js"></script>
	<script src="js/auth.js"></script>

	<script>
		const form = document.getElementById("form");
		const msg = document.getElementById("msg");

		form.onsubmit = async e => {
			e.preventDefault();

			const r = await signup({
				firstName: document.getElementById("first").value.trim(),
				lastName: document.getElementById("last").value.trim(),
				email: document.getElementById("email").value.trim(),
				phone: document.getElementById("phone").value.trim(),
				address: document.getElementById("address").value.trim(),
				password: document.getElementById("password").value
			});

			msg.textContent = r.ok ? r.message : r.error;
			msg.className = "message " + (r.ok ? "success" : "error");

			if (r.ok && r.session) {
				setTimeout(() => {
					location.href = "orders.html";
				}, 600);
			}
		};
	</script>
</body>
</html>
