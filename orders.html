<!doctype html>
<html lang="fa" dir="rtl">

<head>

	<meta charset="utf-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1"
	>

	<title>سفارش‌ها | T-Choob Video</title>

	<link
		rel="stylesheet"
		href="css/style.css"
	>

</head>


<body>

	<header class="site-header">

		<div class="container header-inner">

			<a
				class="brand"
				href="index.html"
			>
				T-Choob Video
			</a>


			<nav class="nav">

				<a
					class="active"
					href="orders.html"
				>
					سفارش‌ها
				</a>

				<a href="new-order.html">
					ثبت سفارش
				</a>

				<a href="profile.html">
					پروفایل
				</a>

				<button
					id="logout"
					type="button"
				>
					خروج
				</button>

			</nav>


			<button
				id="theme"
				class="theme"
				type="button"
			>
				حالت تاریک
			</button>

		</div>

	</header>



	<main class="page">

		<div class="container">

			<div class="page-head">

				<div>

					<span class="eyebrow">
						T-Choob Video
					</span>

					<h1>
						سفارش‌های من
					</h1>

				</div>


				<a
					class="button primary"
					href="new-order.html"
				>
					ثبت سفارش جدید
				</a>

			</div>



			<div
				id="list"
				class="orders"
			></div>

		</div>

	</main>



	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

	<script src="js/config.js"></script>

	<script src="js/supabase.js"></script>

	<script src="js/auth.js"></script>

	<script src="js/app.js"></script>



	<script>

		async function loadOrders() {

			const list =
				document.getElementById("list");


			const auth =
				await requireUser();


			if (!auth) {
				return;
			}


			const {
				data,
				error
			} = await window.db
				.from("video_orders")
				.select("*")
				.eq(
					"customer_id",
					auth.user.id
				)
				.order(
					"created_at",
					{
						ascending: false
					}
				);


			if (error) {

				console.error(
					"LOAD ORDERS ERROR:",
					error
				);

				list.innerHTML =
					`
						<div class="empty">
							دریافت سفارش‌ها انجام نشد.
							<br>
							<small>
								${esc(error.message)}
							</small>
						</div>
					`;

				return;
			}


			if (!data || !data.length) {

				list.innerHTML =
					`
						<div class="empty">

							<h2>
								هنوز سفارشی ثبت نشده است.
							</h2>

							<a
								class="button primary"
								href="new-order.html"
							>
								ثبت سفارش
							</a>

						</div>
					`;

				return;
			}


			list.innerHTML =
				data
					.map(
						order => `

							<a
								class="order"
								href="order.html?id=${encodeURIComponent(order.id)}"
							>

								<div>

									<small class="eyebrow">
										${esc(order.order_number)}
									</small>

									<h2>
										${esc(order.title)}
									</h2>

									<p>
										${esc(order.subject)}
									</p>

								</div>


								<div>

									<span
										class="status status-${esc(order.status)}"
									>
										${statusText(order.status)}
									</span>

									<p>
										${date(order.created_at)}
									</p>

								</div>

							</a>

						`
					)
					.join("");

		}


		document.addEventListener(
			"DOMContentLoaded",
			loadOrders
		);


		document
			.getElementById("logout")
			.addEventListener(
				"click",
				logout
			);

	</script>

</body>

</html>
