<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سفارش‌ها</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">T-Choob Video</a><nav class="nav"><a class="active" href="orders.html">سفارش‌ها</a><a href="new-order.html">ثبت سفارش</a><a href="profile.html">پروفایل</a><button id="logout">خروج</button></nav><button id="theme" class="theme">حالت تاریک</button></div></header><main class="page"><div class="container"><div class="page-head"><h1>سفارش‌های من</h1><a class="button primary" href="new-order.html">ثبت سفارش جدید</a></div><div id="list" class="orders"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script>(async()=>{const a=await requireUser();if(!a)return;const r=await supabase.from("video_orders").select("*").eq("customer_id",a.user.id).order("created_at",{ascending:false});if(r.error){list.innerHTML="<div class=empty>دریافت سفارش‌ها انجام نشد.</div>";return}list.innerHTML=r.data.length?r.data.map(o=>`<a class="order" href="order.html?id=${o.id}"><div><small class="eyebrow">${esc(o.order_number)}</small><h2>${esc(o.title)}</h2><p>${esc(o.subject)}</p></div><div><span class="status status-${esc(o.status)}">${statusText(o.status)}</span><p>${date(o.created_at)}</p></div></a>`).join(""):"<div class=empty><h2>هنوز سفارشی ثبت نشده است.</h2><a class='button primary' href='new-order.html'>ثبت سفارش</a></div>"})();logout.onclick=logout;</script></body></html>
